<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Message</title>
<meta name="description" content="Chat with anyone and turn messages into tasks.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Task Message">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <div class="banner" id="banner" hidden></div>
  <nav class="rail" aria-label="Main">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16v9.5H11l-5 4v-4H4z"/><path d="M8.5 11l2.2 2.2L15.5 8.6"/></svg>
    </div>
    <button class="navb" data-view="chats" aria-current="true"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16v10h-9l-5 4v-4H4z"/></svg></span>Chats<span class="dot" id="unreadDot" hidden></span></button>
    <button class="navb" data-view="board"><span class="pill"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.8-5"/></svg></span>Tasks<span class="dot" id="mineDot" hidden></span></button>
    <button class="me" id="meAv" aria-label="Profile and settings" title="Profile and settings"></button>
  </nav>
  <!-- views injected -->
</div>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="tones.js"></script>
<script src="app.js"></script>
</body>
</html>
