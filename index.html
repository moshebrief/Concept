<!-- iPhone Safari colours its top and bottom bars from fixed strips at the screen edges; these hidden strips carry the colour of the bar next to each edge -->
<div id="tint-top" aria-hidden="true"></div><div id="tint-bot" aria-hidden="true"></div>
<div id="boot" aria-hidden="true"><img src="icon.svg" alt="" width="88" height="88"></div>
<div class="app" id="app">
  <div class="banner" id="banner" hidden></div>
  <nav class="rail" aria-label="Main">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16v9.5H11l-5 4v-4H4z"/><path d="M8.5 11l2.2 2.2L15.5 8.6"/></svg>
    </div>
    <button class="navb" data-view="chats" aria-current="true"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16v10h-9l-5 4v-4H4z"/></svg></span>Chats<span class="dot" id="unreadDot" hidden></span></button>
    <button class="navb" data-view="board"><span class="pill"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.8-5"/></svg></span>Tasks<span class="dot" id="mineDot" hidden></span></button>
    <button class="navb" data-view="notes"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M6 3.5h12A1.5 1.5 0 0 1 19.5 5v10l-5 5H6A1.5 1.5 0 0 1 4.5 18.5V5A1.5 1.5 0 0 1 6 3.5z"/><path d="M14.5 20v-3.5A1.5 1.5 0 0 1 16 15h3.5M8 8.5h8M8 12h5"/></svg></span>Notes</button>
    <button class="navb" data-view="files"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 7.2A1.7 1.7 0 0 1 5.2 5.5h4.1l1.9 2h7.6a1.7 1.7 0 0 1 1.7 1.7v8.6a1.7 1.7 0 0 1-1.7 1.7H5.2a1.7 1.7 0 0 1-1.7-1.7z"/></svg></span>Files</button>
    <button class="navb navset" data-view="settings"><span class="pill"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>Settings</button>
